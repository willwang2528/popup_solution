plugins {
    id "com.android.application"
}

def pmabSourceRevision = providers.gradleProperty("pmabSourceRevision")
        .orElse("uncommitted")

android {
    namespace "org.pmab.collector"
    compileSdk 35

    defaultConfig {
        applicationId "org.pmab.collector"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "android.app.Instrumentation"
        buildConfigField "String", "SOURCE_REVISION", "\"${pmabSourceRevision.get()}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
